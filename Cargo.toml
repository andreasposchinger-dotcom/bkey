[package]
name = "bkey"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Tiny single-binary secrets vault for humans, AI agents and the browser"
license-file = "LICENSE"
repository = "https://github.com/rasportiy/bkey"
readme = "README.md"
keywords = ["secrets", "vault", "agent", "password-manager", "acl"]
categories = ["command-line-utilities"]

[[bin]]
name = "bkey"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand = "0.8"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
hex = "0.4"
tiny_http = "0.12"

[profile.release]
lto = true
strip = true
opt-level = "z"
panic = "abort"
