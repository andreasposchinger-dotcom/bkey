name: CI
on: [push, pull_request]

permissions:
  contents: read
  issues: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (captured)
        run: |
          set -o pipefail
          cargo build --locked --release 2>&1 | tee build.log
      - name: Test (captured)
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee test.log
      - name: Report failure as issue
        if: failure()
        run: |
          {
            echo "CI failure on ${{ runner.os }} (rustc: $(rustc --version), commit ${{ github.sha }})"
            echo
            echo "## build.log (tail)"
            echo '```'
            tail -n 100 build.log
            echo '```'
            if [ -f test.log ]; then
              echo "## test.log (tail)"
              echo '```'
              tail -n 60 test.log
              echo '```'
            fi
          } > issue_body.md
          python3 - <<'PY'
          import json
          body = open("issue_body.md").read()
          json.dump({"title": "CI auto-report: build/test failure", "body": body},
                    open("payload.json", "w"))
          PY
          curl -s -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            --data @payload.json
