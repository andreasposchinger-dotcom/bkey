<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; width: 300px; margin: 0;
           padding: 12px; background: #16181d; color: #e8e8ec; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    h1 small { color: #8b93a3; font-weight: 400; }
    label { display: block; margin: 8px 0 3px; color: #9aa3b2; font-size: 11px;
            text-transform: uppercase; letter-spacing: .06em; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px;
            border-radius: 6px; border: 1px solid #343946;
            background: #101318; color: #fff; }
    button { margin-top: 8px; padding: 7px 10px; width: 100%; border: 0;
             border-radius: 6px; background: #3b74e0; color: #fff;
             font-weight: 600; cursor: pointer; }
    button.sec { background: #2a3040; }
    #status { margin-top: 10px; font-size: 12px; color: #9fd0ff; min-height: 16px; }
    .err { color: #ff8f8f; }
    .ok { color: #8fe39a; }
    hr { border: 0; border-top: 1px solid #2c313c; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>bkey <small>lokaler Passwort-Manager</small></h1>
  <div id="status">lädt...</div>
  <hr>

  <label for="serverUrl">bkey-Server-URL</label>
  <input id="serverUrl" placeholder="http://127.0.0.1:8642">

  <label>Agent-Token (Nur-Fill-Modus, optional)</label>
  <input id="agentName" placeholder="Agent-Name, z. B. browser">
  <input id="agentToken" placeholder="Token aus: bkey agent add browser">
  <button id="save" class="sec">Einstellungen speichern</button>
  <hr>

  <label for="passphrase">Master-Passphrase (Vollmodus)</label>
  <input id="passphrase" type="password" placeholder="Master-Passphrase">
  <button id="unlock">Entsperren (füllen + speichern)</button>
  <button id="lock" class="sec">Sperren</button>

  <script src="popup.js"></script>
</body>
</html>
